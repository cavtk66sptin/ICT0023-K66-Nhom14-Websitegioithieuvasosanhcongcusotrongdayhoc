<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - So sánh công cụ số trong dạy học</title>
    
</head>
<body>

    <nav>
        <a href="huongdan.html">Hướng dẫn sử dụng</a>
        <a href="lienhe.html">Liên hệ & Góp ý</a>
    </nav>

    <section>
        <h2>Góp Ý & Đề Xuất Công Cụ Số</h2>
        <p>Hãy chia sẻ ý kiến hoặc đề xuất thêm các công cụ dạy học mới để chúng tôi cập nhật vào hệ thống so sánh.</p>
        
        <form id="contactForm" novalidate>
            <div class="form-group">
                <label for="fullname">Họ và tên: <span>*</span></label>
                <input type="text" id="fullname" name="fullname" placeholder="Nhập họ tên của bạn">
                <span id="nameError" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="email">Email: <span>*</span></label>
                <input type="email" id="email" name="email" placeholder="example@domain.com">
                <span id="emailError" class="error-message"></span>
            </div>

            <div class="form-group">
                <label for="feedback">Nội dung góp ý / Đề xuất công cụ: <span>*</span></label>
                <textarea id="feedback" name="feedback" placeholder="Nhập nhận xét về website hoặc đề xuất công cụ số bạn muốn bổ sung..."></textarea>
                <span id="feedbackError" class="error-message"></span>
            </div>

            <button type="submit">Gửi Góp Ý</button>

            <div id="successBox" class="success-message">
                Cảm ơn bạn! Ý kiến đóng góp về công cụ số dạy học đã được gửi thành công.
            </div>
        </form>
    </section>

</body>
</html>
