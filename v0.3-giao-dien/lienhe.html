<body>

    <main>
        <section class="contact-section">
            <div class="container">
            <div class="row g-5 align-items-start">
                <div class="col-lg-5">
                    <p class="eyebrow">KẾT NỐI VỚI CHÚNG MÌNH</p>
                    <h2 class="contact-title">Bạn có câu hỏi hoặc ý tưởng?</h2>
                    <p class="muted-text">Hãy để lại lời nhắn. Nhóm sẽ tiếp nhận thông tin ngay!</p>
                </div>
                <div class="col-lg-7">
                    <form id="contact-form" class="contact-form" novalidate>
                        <div class="row g-3">
                            <div class="col-md-6"><label for="full-name" class="form-label">Họ và tên </label><input id="full-name" name="full-name" class="form-control" type="text" placeholder="Nhập họ tên" required></div>
                            <div class="col-md-6"><label for="email" class="form-label">Email </label><input id="email" name="email" class="form-control" type="email" placeholder="name@example.com" required></div>
                            <div class="col-12"><label for="message" class="form-label">Nội dung </label><textarea id="message" name="message" class="form-control" rows="5" placeholder="Viết lời nhắn của bạn..." required></textarea></div>
                            <div class="col-12"><button class="btn btn-brand btn-lg rounded-pill w-100" type="submit">Gửi thông tin <span aria-hidden="true">→</span></button><div id="form-status" class="mt-3" role="status" aria-live="polite"></div></div>
                        </div>
                    </form>
                </div>
            </div>
            </div>
        </section>
    </main>

    <footer><div class="container footer-inner"><span>Website giới thiệu và so sánh công cụ số trong dạy học</span><span>Thiết kế phục vụ học tập</span></div></footer>
